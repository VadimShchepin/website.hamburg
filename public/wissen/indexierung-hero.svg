<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Warum Seiten nicht bei Google erscheinen</title>
  <desc id="desc">Eine redaktionelle Trichtergrafik zeigt viele Seiten, die vom Crawler gefiltert werden. Nur wenige gelangen in den Index, während mehrere rot markierte Seiten als nicht indexiert seitlich herausfallen.</desc>
  <style>
    .navy-stroke{stroke:#0A192F;stroke-width:6;fill:none}
    .soft-stroke{stroke:#172A45;stroke-width:5;fill:none}
    .red-stroke{stroke:#E53935;stroke-width:6;fill:none}
    .label{font-family:Inter,Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#0A192F;text-anchor:middle}
  </style>
  <defs>
    <g id="page">
      <rect x="0" y="0" width="140" height="130" rx="8" fill="#FFFFFF" stroke="#0A192F" stroke-width="6"/>
      <line x1="22" y1="28" x2="118" y2="28" class="soft-stroke"/>
      <line x1="22" y1="58" x2="103" y2="58" class="soft-stroke"/>
      <line x1="22" y1="84" x2="116" y2="84" class="soft-stroke"/>
      <line x1="22" y1="108" x2="82" y2="108" class="soft-stroke"/>
    </g>
    <g id="rejected-page">
      <rect x="0" y="0" width="112" height="82" rx="7" fill="#FFFFFF" stroke="#E53935" stroke-width="6"/>
      <line x1="16" y1="22" x2="56" y2="22" stroke="#666666" stroke-width="4"/>
      <line x1="16" y1="42" x2="48" y2="42" stroke="#666666" stroke-width="4"/>
      <line x1="72" y1="26" x2="94" y2="52" class="red-stroke"/>
      <line x1="94" y1="26" x2="72" y2="52" class="red-stroke"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F5F7FA"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <text x="800" y="78" class="label">Seiten</text>

    <use href="#page" transform="translate(55 120)"/>
    <use href="#page" transform="translate(250 120)"/>
    <use href="#page" transform="translate(445 120)"/>
    <use href="#page" transform="translate(640 120)"/>
    <use href="#page" transform="translate(835 120)"/>
    <use href="#page" transform="translate(1030 120)"/>
    <use href="#page" transform="translate(1225 120)"/>
    <use href="#page" transform="translate(1415 120)"/>

    <g class="navy-stroke">
      <path d="M125 270v48m-10-12 10 12 10-12"/>
      <path d="M320 270v48m-10-12 10 12 10-12"/>
      <path d="M515 270v48m-10-12 10 12 10-12"/>
      <path d="M710 270v48m-10-12 10 12 10-12"/>
      <path d="M905 270v48m-10-12 10 12 10-12"/>
      <path d="M1100 270v48m-10-12 10 12 10-12"/>
      <path d="M1295 270v48m-10-12 10 12 10-12"/>
      <path d="M1485 270v48m-10-12 10 12 10-12"/>
    </g>

    <path d="M130 340h1380l-480 285v40H570v-40Z" fill="#E9EEF3" stroke="#0A192F" stroke-width="7"/>

    <g aria-label="Crawler-Roboter">
      <line x1="800" y1="403" x2="800" y2="378" class="navy-stroke"/>
      <circle cx="800" cy="369" r="9" fill="#FFFFFF" stroke="#0A192F" stroke-width="6"/>
      <rect x="704" y="410" width="192" height="122" rx="24" fill="#FFFFFF" stroke="#0A192F" stroke-width="7"/>
      <path d="M704 452h-22v38h22M896 452h22v38h-22" class="navy-stroke"/>
      <circle cx="759" cy="465" r="10" fill="#172A45"/>
      <circle cx="841" cy="465" r="10" fill="#172A45"/>
      <path d="M755 502h90" class="soft-stroke"/>
    </g>
    <text x="800" y="580" class="label">Crawler</text>

    <g class="red-stroke">
      <path d="M1210 428c78 2 118 22 174 39m-15-13 15 13-18 6"/>
      <path d="M1130 508c72 18 116 60 170 89m-11-17 11 17-19 1"/>
      <path d="M1042 586c72 29 111 91 158 128m-7-19 7 19-19-3"/>
    </g>
    <use href="#rejected-page" transform="translate(1400 430)"/>
    <use href="#rejected-page" transform="translate(1315 560)"/>
    <use href="#rejected-page" transform="translate(1215 680)"/>

    <path d="M800 666v17m-10-10 10 10 10-10" class="navy-stroke"/>
    <use href="#page" transform="translate(585 690) scale(.88)"/>
    <use href="#page" transform="translate(740 690) scale(.88)"/>
    <use href="#page" transform="translate(895 690) scale(.88)"/>
    <text x="800" y="850" class="label">Index</text>
    <text x="1370" y="830" font-family="Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#E53935" text-anchor="middle">nicht indexiert</text>
  </g>
</svg>
