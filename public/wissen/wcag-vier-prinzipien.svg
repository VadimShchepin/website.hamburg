<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Die vier Prinzipien der Barrierefreiheit</title>
  <desc id="desc">Vier gleich große Karten erklären die WCAG-Prinzipien wahrnehmbar, bedienbar, verständlich und robust mit klaren Piktogrammen.</desc>
  <rect x="40" y="40" width="1520" height="820" rx="24" fill="#F5F7FA"/>

  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="70" y="155" width="335" height="590" rx="24" fill="#FFFFFF" stroke="#172A45" stroke-width="5"/>
    <rect x="88" y="175" width="299" height="82" rx="14" fill="#E9EEF3"/>
    <path d="M100 280H375" fill="none" stroke="#172A45" stroke-width="4"/>
    <text x="237.5" y="229" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">wahrnehmbar</text>
    <g fill="none" stroke="#0A192F" stroke-width="6">
      <path d="M141 442c39-53 154-53 193 0-39 53-154 53-193 0Z"/>
      <circle cx="237.5" cy="442" r="34"/>
    </g>
    <circle cx="237.5" cy="442" r="11" fill="#172A45"/>
    <text x="237.5" y="660" fill="#666666" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Kontrast</text>

    <rect x="445" y="155" width="335" height="590" rx="24" fill="#FFFFFF" stroke="#172A45" stroke-width="5"/>
    <rect x="463" y="175" width="299" height="82" rx="14" fill="#E9EEF3"/>
    <path d="M475 280H750" fill="none" stroke="#172A45" stroke-width="4"/>
    <text x="612.5" y="229" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">bedienbar</text>
    <g stroke="#0A192F" stroke-width="6">
      <rect x="535" y="369" width="155" height="146" rx="22" fill="#FFFFFF"/>
      <rect x="564" y="398" width="97" height="57" rx="11" fill="#E9EEF3"/>
      <path d="M561 485H664" fill="none"/>
    </g>
    <text x="612.5" y="660" fill="#666666" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Tastatur</text>

    <rect x="820" y="155" width="335" height="590" rx="24" fill="#FFFFFF" stroke="#E53935" stroke-width="7"/>
    <rect x="838" y="175" width="299" height="82" rx="14" fill="#E9EEF3"/>
    <path d="M850 280H1125" fill="none" stroke="#172A45" stroke-width="4"/>
    <text x="987.5" y="229" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">verständlich</text>
    <path d="M925 370h125q24 0 24 24v74q0 24-24 24h-60l-40 33 8-33h-33q-25 0-25-24v-74q0-24 25-24Z" fill="#FFFFFF" stroke="#0A192F" stroke-width="6"/>
    <g fill="#172A45">
      <circle cx="946" cy="431" r="8"/>
      <circle cx="987" cy="431" r="8"/>
      <circle cx="1028" cy="431" r="8"/>
    </g>
    <text x="987.5" y="660" fill="#666666" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Beschriftung</text>

    <rect x="1195" y="155" width="335" height="590" rx="24" fill="#FFFFFF" stroke="#172A45" stroke-width="5"/>
    <rect x="1213" y="175" width="299" height="82" rx="14" fill="#E9EEF3"/>
    <path d="M1225 280H1500" fill="none" stroke="#172A45" stroke-width="4"/>
    <text x="1362.5" y="229" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">robust</text>
    <g fill="none" stroke="#0A192F" stroke-width="7">
      <path d="M1335 382l-53 56 53 56M1390 382l53 56-53 56M1382 360l-40 156"/>
    </g>
    <text x="1362.5" y="660" fill="#666666" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">HTML</text>
  </g>
</svg>
