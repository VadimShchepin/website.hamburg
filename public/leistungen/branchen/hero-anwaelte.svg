<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" stroke-linejoin="round" stroke-linecap="round">
  <title id="title">Anwaltskanzlei mit sichtbarer Mandatsanfrage</title>
  <desc id="desc">Plakative Illustration einer großen Justitia-Waage vor einer Kanzleifassade. Eine Waagschale ist eine rote Sprechblase mit dem Wort Mandat.</desc>

  <!-- Zurückhaltende Kanzleifassade -->
  <g aria-hidden="true">
    <path d="M195 252 600 70l405 182Z" fill="#FFFFFF" stroke="#E9EEF3" stroke-width="8"/>
    <path d="M330 218 600 106l270 112Z" fill="#E9EEF3"/>
    <rect x="175" y="252" width="850" height="76" rx="10" fill="#FFFFFF" stroke="#E9EEF3" stroke-width="8"/>

    <g fill="#FFFFFF" stroke="#E9EEF3" stroke-width="8">
      <path d="M242 328h142v40H242Zm22 40h98v330h-98Zm-22 330h142v42H242Z"/>
      <path d="M428 328h142v40H428Zm22 40h98v330h-98Zm-22 330h142v42H428Z"/>
      <path d="M630 328h142v40H630Zm22 40h98v330h-98Zm-22 330h142v42H630Z"/>
      <path d="M816 328h142v40H816Zm22 40h98v330h-98Zm-22 330h142v42H816Z"/>
    </g>
    <path d="M158 740h884v54H158Z" fill="#FFFFFF" stroke="#E9EEF3" stroke-width="8"/>
  </g>

  <!-- Große Justitia-Waage -->
  <g aria-hidden="true">
    <path d="M574 356h52v402h-52Z" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>
    <path d="M600 232v105" fill="none" stroke="#0A192F" stroke-width="10"/>
    <circle cx="600" cy="219" r="32" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>

    <path d="M244 350h712l-28 45H272Z" fill="#0A192F"/>
    <circle cx="600" cy="372" r="34" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>

    <path d="M283 390 232 505M462 390l-14 115" fill="none" stroke="#172A45" stroke-width="8"/>
    <path d="M738 390 758 558M918 390l78 168" fill="none" stroke="#172A45" stroke-width="8"/>

    <!-- Rote Sprechblase als Waagschale und einziger Blickfang -->
    <path d="M226 505h228c18 0 32 14 32 32v74c0 18-14 32-32 32h-94l-50 44 8-44h-92c-18 0-32-14-32-32v-74c0-18 14-32 32-32Z" fill="#E53935"/>

    <!-- Klassische Gegenschale -->
    <path d="M724 558h288c-15 73-69 109-144 109s-129-36-144-109Z" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>

    <path d="M518 758h164v48H518Z" fill="#172A45" stroke="#0A192F" stroke-width="10"/>
    <path d="M442 806h316v44H442Z" fill="#0A192F"/>
  </g>

  <text x="340" y="592" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="600">Mandat</text>
</svg>
