<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" stroke-linejoin="round" stroke-linecap="round">
  <title id="title">Website-Check in 60 Sekunden</title>
  <desc id="desc">Ein großer runder Tacho mit einem roten Zeiger steht vor einem Browserfenster mit drei Prüfpunkten. Eine kleine Stoppuhr rechts unten ergänzt den schnellen Website-Check.</desc>

  <!-- Das Prüffenster liegt links hinter dem zentralen Tacho. -->
  <rect x="90" y="185" width="490" height="410" rx="30" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>
  <path d="M120 185H550Q580 185 580 215V265H90V215Q90 185 120 185Z" fill="#E9EEF3" stroke="#0A192F" stroke-width="8"/>
  <g fill="#0A192F">
    <circle cx="130" cy="225" r="8"/>
    <circle cx="160" cy="225" r="8"/>
    <circle cx="190" cy="225" r="8"/>
  </g>
  <g fill="none" stroke="#0A192F" stroke-width="10">
    <path d="m130 329 15 15 27-32M210 330H350"/>
    <path d="m133 407 32 32m0-32-32 32M210 423H350"/>
    <path d="m130 515 15 15 27-32M210 516H350"/>
  </g>

  <!-- Ein großes, ruhiges Zifferblatt ohne Zahlen oder Zusatzlabels. -->
  <circle cx="670" cy="420" r="280" fill="#E9EEF3" stroke="#0A192F" stroke-width="10"/>
  <circle cx="670" cy="420" r="252" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>
  <path d="M480 530A220 220 0 1 1 860 530L822 508A176 176 0 1 0 518 508Z" fill="#E9EEF3"/>
  <g fill="none" stroke="#0A192F" stroke-width="10">
    <path d="m481 529 29-17M452 420H486m-5-109 29 17m51-97 17 29M670 202V236m109-5-17 29m97 51-29 17M888 420H854m5 109-29-17"/>
  </g>

  <!-- Der Zeiger ist das einzige rote Element. -->
  <path d="M652 403 806 282 687 439Q669 452 654 437Q640 423 652 403Z" fill="#E53935"/>
  <circle cx="670" cy="420" r="17" fill="#0A192F"/>

  <!-- Die kleine Stoppuhr bleibt klar vom Tacho getrennt. -->
  <g stroke="#0A192F" stroke-width="8">
    <path d="M1010 582V602m64 14 17-17" fill="none"/>
    <rect x="986" y="562" width="48" height="24" rx="7" fill="#0A192F"/>
    <circle cx="1010" cy="690" r="88" fill="#FFFFFF"/>
    <path d="M1010 626V640m64 50H1060m-50 64V740m-64-50H960" fill="none"/>
    <path d="M1010 650V690l28 20" fill="none"/>
    <circle cx="1010" cy="690" r="7" fill="#0A192F"/>
  </g>
  <text x="670" y="800" text-anchor="middle" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="50" font-weight="600">60 Sekunden</text>
</svg>
