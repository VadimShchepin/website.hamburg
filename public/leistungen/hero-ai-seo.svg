<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" stroke-linejoin="round" stroke-linecap="round">
  <title id="title">AI SEO: Chat-Antwort zitiert eine Website</title>
  <desc id="desc">Ein großer Chat-Antwortblock mit klaren Textzeilen. Ein roter Pfeil führt zur Website, die als zitierte Quelle markiert ist.</desc>

  <!-- Großer Chat-Antwortblock -->
  <path d="M156 160H754C787 160 814 187 814 220V616C814 649 787 676 754 676H294L218 734V676H156C123 676 96 649 96 616V220C96 187 123 160 156 160Z" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>

  <!-- Antwort-Absender -->
  <circle cx="202" cy="258" r="49" fill="#0A192F"/>
  <path d="M202 229V287M173 258H231M181 237L223 279M223 237L181 279" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <rect x="282" y="221" width="290" height="31" rx="15.5" fill="#172A45"/>
  <rect x="282" y="272" width="184" height="22" rx="11" fill="#E9EEF3"/>

  <!-- Große Antwortzeilen -->
  <rect x="172" y="365" width="548" height="28" rx="14" fill="#172A45"/>
  <rect x="172" y="423" width="466" height="28" rx="14" fill="#172A45"/>
  <rect x="172" y="481" width="518" height="28" rx="14" fill="#172A45"/>
  <rect x="172" y="539" width="350" height="28" rx="14" fill="#666666"/>

  <!-- Zitat-Hinweis -->
  <text x="970" y="427" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" text-anchor="middle">zitiert</text>

  <!-- Einziger roter Blickfang: Pfeil zur Quelle -->
  <path d="M756 468C815 471 861 489 896 524L915 497L943 566L871 551L891 532C858 504 817 488 754 485Z" fill="#E53935"/>

  <!-- Website als zitierte Quelle -->
  <rect x="866" y="578" width="258" height="194" rx="26" fill="#FFFFFF" stroke="#0A192F" stroke-width="10"/>
  <path d="M871 642H1119" fill="none" stroke="#0A192F" stroke-width="8"/>
  <circle cx="910" cy="611" r="10" fill="#172A45"/>
  <circle cx="946" cy="611" r="10" fill="#E9EEF3" stroke="#172A45" stroke-width="6"/>
  <rect x="910" y="678" width="82" height="52" rx="10" fill="#E9EEF3"/>
  <path d="M1019 688H1080M1019 720H1060" fill="none" stroke="#172A45" stroke-width="8"/>
</svg>
