<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" stroke-linejoin="round" stroke-linecap="round">
  <title id="title">SEO-Kosten pro Monat</title>
  <desc id="desc">Ein großer Münzstapel mit Eurozeichen, aus dem eine rote Pfeilkurve nach rechts oben zu einer Lupe steigt.</desc>

  <!-- Unterste Münze -->
  <g stroke="#0A192F" stroke-width="9">
    <ellipse cx="530" cy="595" rx="250" ry="52" fill="#E9EEF3"/>
    <path d="M280 595V770C280 803 392 830 530 830S780 803 780 770V595C780 636 668 669 530 669S280 636 280 595Z" fill="#FFFFFF"/>
  </g>

  <!-- Mittlere Münzen -->
  <g stroke="#0A192F" stroke-width="9">
    <ellipse cx="500" cy="485" rx="250" ry="52" fill="#E9EEF3"/>
    <path d="M250 485V610C250 638 362 660 500 660S750 638 750 610V485C750 526 638 559 500 559S250 526 250 485Z" fill="#FFFFFF"/>

    <ellipse cx="540" cy="375" rx="250" ry="52" fill="#E9EEF3"/>
    <path d="M290 375V495C290 523 402 545 540 545S790 523 790 495V375C790 416 678 449 540 449S290 416 290 375Z" fill="#172A45"/>
  </g>

  <!-- Oberste Münze -->
  <g stroke="#0A192F" stroke-width="9">
    <ellipse cx="515" cy="265" rx="250" ry="52" fill="#E9EEF3"/>
    <path d="M265 265V390C265 418 377 440 515 440S765 418 765 390V265C765 306 653 339 515 339S265 306 265 265Z" fill="#FFFFFF"/>
  </g>

  <!-- Beschriftungen -->
  <text x="515" y="282" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" text-anchor="middle">SEO</text>
  <text x="540" y="522" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="70" font-weight="600" text-anchor="middle">€</text>
  <rect x="397" y="692" width="266" height="76" rx="38" fill="#E9EEF3" stroke="#0A192F" stroke-width="8"/>
  <text x="530" y="742" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" text-anchor="middle">pro Monat</text>

  <!-- Die einzige rote Akzentform: Wachstumspfeil -->
  <path d="M600 470C694 438 755 382 804 325C850 271 881 229 930 200M891 208L938 192L924 240" fill="none" stroke="#E53935" stroke-width="10"/>

  <!-- Lupe -->
  <g stroke="#0A192F" stroke-width="10">
    <circle cx="982" cy="132" r="54" fill="#FFFFFF"/>
    <path d="M1020 170L1065 215" fill="none"/>
  </g>
</svg>
