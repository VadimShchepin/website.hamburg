<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" stroke-linejoin="round" stroke-linecap="round">
  <title id="title">Digitale Steuerkanzlei</title>
  <desc id="desc">Ein großer Aktenordner mit dem Label Kanzlei führt einen Papierstapel in geordnete digitale Karten über. Daneben setzt ein rotes Prozentzeichen einen klaren Blickfang.</desc>

  <rect x="86" y="746" width="1028" height="42" rx="21" fill="#E9EEF3"/>

  <g aria-label="Papierstapel" fill="#FFFFFF" stroke="#0A192F" stroke-width="8">
    <path d="M482 374H696L764 442V687H482Z" fill="#E9EEF3"/>
    <path d="M470 358H690L754 422V676H470Z"/>
    <path d="M458 344H682L748 410V665H458Z"/>
    <path d="M682 344V410H748" fill="#E9EEF3"/>
    <path d="M501 420H665M501 476H691M501 532H650" fill="none" stroke="#666666"/>
  </g>

  <g aria-label="Digitale Karten">
    <rect x="700" y="366" width="390" height="184" rx="24" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>
    <rect x="738" y="407" width="72" height="72" rx="16" fill="#172A45"/>
    <path d="M850 424H1034M850 469H984" fill="none" stroke="#666666" stroke-width="8"/>
    <rect x="754" y="584" width="302" height="142" rx="24" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>
    <rect x="790" y="619" width="56" height="56" rx="14" fill="#172A45"/>
    <path d="M882 631H1015M882 671H974" fill="none" stroke="#666666" stroke-width="8"/>
  </g>

  <g aria-label="Aktenordner">
    <rect x="128" y="178" width="456" height="568" rx="30" fill="#172A45" stroke="#0A192F" stroke-width="10"/>
    <path d="M244 183V741" fill="none" stroke="#0A192F" stroke-width="10"/>
    <rect x="281" y="277" width="246" height="98" rx="18" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>
    <text x="404" y="341" text-anchor="middle" fill="#0A192F" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">Kanzlei</text>
    <circle cx="186" cy="639" r="28" fill="#F5F7FA" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <text x="906" y="285" text-anchor="middle" fill="#E53935" font-family="Inter, Helvetica, Arial, sans-serif" font-size="168" font-weight="600">%</text>
</svg>
