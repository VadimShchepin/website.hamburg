<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Klickpreis gegen Kosten je Anfrage</title>
  <desc id="desc">Drei Balkengruppen vergleichen Klickpreis und Kosten je Anfrage für weitgehend passende, als Wortgruppe passende und exakt passende Suchbegriffe.</desc>

  <rect x="40" y="40" width="1520" height="820" rx="40" fill="#F5F7FA"/>
  <rect x="64" y="48" width="1472" height="804" rx="32" fill="#FFFFFF" stroke="#0A192F" stroke-width="6"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="112" y="94" width="10" height="88" rx="5" fill="#E53935"/>
    <text x="150" y="128" fill="#0A192F" font-size="42" font-weight="700">Klickpreis gegen</text>
    <text x="150" y="178" fill="#0A192F" font-size="42" font-weight="700">Kosten je Anfrage</text>
    <path d="M112 210H1488" fill="none" stroke="#0A192F" stroke-width="5" stroke-linecap="round"/>

    <rect x="96" y="240" width="1408" height="80" rx="18" fill="#E9EEF3"/>
    <text x="430" y="290" fill="#0A192F" font-size="24" font-weight="700">Klickpreis</text>
    <text x="926" y="290" fill="#0A192F" font-size="24" font-weight="700">Kosten je Anfrage</text>

    <rect x="96" y="340" width="1408" height="124" rx="18" fill="#F5F7FA"/>
    <rect x="96" y="492" width="1408" height="124" rx="18" fill="#FFFFFF" stroke="#E9EEF3" stroke-width="4"/>
    <rect x="96" y="644" width="1408" height="124" rx="18" fill="#F5F7FA"/>
    <path d="M392 256V784" fill="none" stroke="#0A192F" stroke-width="5" stroke-linecap="round"/>

    <text x="126" y="411" fill="#172A45" font-size="24" font-weight="600">weitgehend passend</text>
    <text x="126" y="563" fill="#172A45" font-size="24" font-weight="600">Wortgruppe</text>
    <text x="126" y="715" fill="#172A45" font-size="24" font-weight="600">exakt</text>

    <g stroke-linejoin="round" stroke-linecap="round">
      <rect x="430" y="376" width="390" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="430" y="376" width="74" height="52" rx="13" fill="#0A192F"/>
      <rect x="926" y="376" width="520" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="926" y="376" width="520" height="52" rx="13" fill="#E53935"/>

      <rect x="430" y="528" width="390" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="430" y="528" width="225" height="52" rx="13" fill="#0A192F"/>
      <rect x="926" y="528" width="520" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="926" y="528" width="155" height="52" rx="13" fill="#172A45"/>

      <rect x="430" y="680" width="390" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="430" y="680" width="360" height="52" rx="13" fill="#0A192F"/>
      <rect x="926" y="680" width="520" height="52" rx="13" fill="#E9EEF3"/>
      <rect x="926" y="680" width="315" height="52" rx="13" fill="#172A45"/>
    </g>

    <path d="M430 796H820M926 796H1446" fill="none" stroke="#172A45" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 786V806M625 786V806M820 786V806M926 786V806M1186 786V806M1446 786V806" fill="none" stroke="#172A45" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
