<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Google-Unternehmensprofil mit Bewertungen</title>
  <desc id="desc">Ein großer roter Standort-Pin mit weißem Ladengeschäft steht vor einer stilisierten Karte. Darunter zeigen fünf Sterne und das Label Bewertungen die Bedeutung guter Kundenstimmen.</desc>
  <defs>
    <path id="star" d="M0-31 8-10 31-9 13 5 19 28 0 15-19 28-13 5-31-9-8-10Z"/>
    <path id="small-pin" d="M0-43c-28 0-50 22-50 50 0 39 50 92 50 92S50 46 50 7C50-21 28-43 0-43Z"/>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Ruhige Kartenfläche -->
    <rect x="74" y="58" width="1052" height="650" rx="54" fill="#FFFFFF" stroke="#0A192F" stroke-width="8"/>

    <!-- Angedeutete Kartenlinien -->
    <g fill="none" stroke="#E9EEF3" stroke-width="10">
      <path d="M126 238C302 166 410 253 566 218S850 117 1072 184"/>
      <path d="M126 535c176-54 296 49 440 8s316-117 506-43"/>
      <path d="M286 96c55 128 16 251 58 344s90 151 95 226"/>
      <path d="M915 98c-48 118-21 216-47 310s-83 165-103 258"/>
    </g>

    <!-- Dezente Nebenstandorte -->
    <g fill="#172A45" stroke="#0A192F" stroke-width="7">
      <use href="#small-pin" transform="translate(221 349) scale(.72)"/>
      <use href="#small-pin" transform="translate(979 366) scale(.72)"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="221" cy="354" r="13"/>
      <circle cx="979" cy="371" r="13"/>
    </g>

    <!-- Zentraler Standort-Pin: einziger roter Blickfang -->
    <path d="M600 99c-130 0-235 105-235 235 0 154 235 326 235 326s235-172 235-326C835 204 730 99 600 99Z" fill="#E53935" stroke="#0A192F" stroke-width="10"/>

    <!-- Weißes Ladengeschäft im Pin -->
    <g fill="#FFFFFF">
      <path d="M463 279h274l-25-70H488Z"/>
      <path d="M471 295v173h258V295c-12 15-31 24-51 24-18 0-36-8-48-21-12 13-30 21-48 21s-36-8-48-21c-12 13-30 21-48 21-21 0-40-9-53-24Z"/>
    </g>
    <g fill="none" stroke="#0A192F" stroke-width="8">
      <path d="M488 209v67M544 209v67M600 209v67M656 209v67M712 209v67"/>
      <path d="M515 468V364h67v104M622 356h70v62h-70Z"/>
    </g>

    <!-- Bewertungssterne -->
    <g fill="#0A192F">
      <use href="#star" transform="translate(440 710)"/>
      <use href="#star" transform="translate(520 710)"/>
      <use href="#star" transform="translate(600 710)"/>
      <use href="#star" transform="translate(680 710)"/>
      <use href="#star" transform="translate(760 710)"/>
    </g>

    <!-- Label -->
    <rect x="410" y="766" width="380" height="84" rx="42" fill="#0A192F"/>
    <text x="600" y="821" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Bewertungen</text>
  </g>
</svg>
